name: Setup
description: Checkout the repository, set up Node.js and enable Corepack

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24.11.0"
        cache: yarn

    - name: Enable Corepack
      shell: bash
      run: corepack enable
