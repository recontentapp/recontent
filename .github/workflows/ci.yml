name: CI

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Upload package builds
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: |
            packages/core/dist
            packages/recontent/dist
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

  typecheck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download package builds
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      - name: Typecheck
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download package builds
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      - name: Test
        run: yarn test

  knip:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download package builds
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: packages

      - name: Knip
        run: yarn knip
        env:
          KNIP_DISABLE_RAW_TRANSFER: "1"
