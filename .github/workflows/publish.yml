name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify package versions match release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for dir in packages/core packages/recontent; do
            pkg_version=$(node -p "require('./$dir/package.json').version")
            if [ "$pkg_version" != "$TAG" ]; then
              echo "Tag version ($TAG) does not match $dir/package.json version ($pkg_version)" >&2
              exit 1
            fi
          done

      - name: Build
        run: pnpm build

      # Publishes core before recontent (dependency order) and skips versions already on npm,
      # so a partially failed run can be re-run
      - name: Publish to npm
        run: pnpm publish --recursive --provenance --access public --no-git-checks
