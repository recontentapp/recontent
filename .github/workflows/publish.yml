name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve package from release tag
        id: package
        run: |
          tag="${{ github.event.release.tag_name }}"
          case "$tag" in
            core-v*)
              echo "dir=packages/core" >> "$GITHUB_OUTPUT"
              echo "version=${tag#core-v}" >> "$GITHUB_OUTPUT"
              ;;
            recontent-v*)
              echo "dir=packages/recontent" >> "$GITHUB_OUTPUT"
              echo "version=${tag#recontent-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unrecognized tag '$tag'. Expected 'core-vX.Y.Z' or 'recontent-vX.Y.Z'." >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify package.json version matches release tag
        run: |
          pkg_version=$(node -p "require('./${{ steps.package.outputs.dir }}/package.json').version")
          if [ "$pkg_version" != "${{ steps.package.outputs.version }}" ]; then
            echo "Tag version (${{ steps.package.outputs.version }}) does not match ${{ steps.package.outputs.dir }}/package.json version ($pkg_version)" >&2
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Publish to npm
        working-directory: ${{ steps.package.outputs.dir }}
        run: pnpm publish --provenance --access public --no-git-checks
