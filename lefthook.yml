pre-commit:
  # Sequential so the README is formatted before it is copied
  commands:
    lint:
      priority: 1
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    format:
      priority: 2
      glob: "*"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # npm publishes packages/recontent/README.md, keep it identical to the root one
    readme:
      priority: 3
      glob: "README.md"
      run: cp README.md packages/recontent/README.md && git add packages/recontent/README.md
